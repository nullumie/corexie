name: Build and Test (Feature)

on:
  push:
    branches-ignore:
      - dev
      - develop
      - main
      - master

jobs:
  push-branch-feature:
    name: Build and Test (Feature)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build and Test (Feature)
        run: mvn clean install -Pfeature -B -ntp