name: Build and Test (Production)

on:
  push:
    branches:
      - main
      - master

jobs:
  push-branch-feature:
    name: Build and Test (Production)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build and Test (Production)
        run: mvn clean install -Pproduction -B -ntp